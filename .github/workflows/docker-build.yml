name: Build and Push Twenty Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    # Runner ARM64 natif de GitHub : compile en ARM64 sans émulateur QEMU !
    # (Si votre dépôt GitHub est Privé sur un compte gratuit, remplacez par : ubuntu-latest)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pebb-crm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max